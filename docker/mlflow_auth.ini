[mlflow]
# Without a login nobody can read runs; the admin can create more users if needed.
default_permission = READ
database_uri = sqlite:////mlflow/data/basic_auth.db
admin_username = admin
# The admin password comes from the environment variable MLFLOW_AUTH_ADMIN_PASSWORD
# (set in docker-compose.yml from .env), so it is not written in this file.
authorization_function = mlflow.server.auth:authenticate_request_basic_auth
